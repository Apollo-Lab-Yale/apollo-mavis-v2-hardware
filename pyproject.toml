[project]
name = "apollo-xarm7-hardware"
version = "0.1.0"
description = "Real xArm7 drivers, netsetup, and camera backends for the apollo-xarm7 stack"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
    "apollo-xarm7-core",
    "numpy>=1.24,<3",
    "pydantic>=2.5,<3",
    "xarm-python-sdk==1.18.5",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
realsense = ["pyrealsense2>=2.54"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.10",
    "hypothesis>=6",
]

[tool.uv.sources]
apollo-xarm7-core = { path = "../apollo-xarm7-core", editable = true }
# 1.18.5 is the version the research note was verified against; PyPI tops out
# at 1.18.4, so pin the exact upstream commit whose xarm/version.py == 1.18.5.
xarm-python-sdk = { git = "https://github.com/xArm-Developer/xArm-Python-SDK", rev = "d911319cebc45142613e18086aabb8067b18ab7f" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apollo_xarm7_hardware"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"mujoco".msg = "hardware must not import mujoco (twin lives in sim)"
"fastapi".msg = "hardware must not import fastapi (server lives in runtime)"
"torch".msg = "hardware must not import torch"
"lerobot".msg = "hardware must not import lerobot"
"mink".msg = "hardware must not import mink"
"apollo_xarm7_sim".msg = "hardware depends only on core"
"apollo_xarm7_runtime".msg = "hardware depends only on core"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
